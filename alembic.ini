# Alembic configuration.
#
# sqlalchemy.url is deliberately blank: the URL comes from DATABASE_URL at
# runtime, set in migrations/env.py. Committing a connection string here is how
# credentials end up in version control.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

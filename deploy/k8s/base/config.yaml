apiVersion: v1
kind: ConfigMap
metadata:
  name: judgekit-config
data:
  REDIS_URL: "redis://redis:6379/0"
  JUDGEKIT_QUEUE: "arq"
  JUDGEKIT_PROVIDER: "stub"
  JUDGEKIT_RUBRIC_DIR: "/app/rubrics"
  JUDGEKIT_DATASET_DIR: "/app/datasets"
  JUDGEKIT_CONCURRENCY: "8"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
---
# Placeholder only. A real cluster gets these from External Secrets, Sealed
# Secrets or the cloud provider's secret store - never from a file in git.
# Committed here with empty values so `kubectl apply -k` works out of the box
# and so the shape of what is needed is documented.
apiVersion: v1
kind: Secret
metadata:
  name: judgekit-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://judgekit:judgekit@postgres:5432/judgekit"
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""

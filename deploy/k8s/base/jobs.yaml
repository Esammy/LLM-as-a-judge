# Migrations run as a Job with a pre-install/pre-upgrade ordering hook in mind:
# nothing should serve traffic against a schema that does not exist yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    # Kustomize has no hook system; with Argo CD or Helm this is what orders it
    # ahead of the Deployments. Applied on its own, run it first.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: migrate
          image: ghcr.io/esammy/judgekit-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: judgekit-config }
            - secretRef: { name: judgekit-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Nightly regression run.
#
# Judges drift: a rubric that agreed with your reviewers in January may not in
# April, which is why calibration is a recurring job rather than a one-off. This
# re-runs the suite against the same dataset and rubric every night so the drift
# shows up as a trend rather than as a surprise.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
spec:
  schedule: "0 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid      # never overlap with a still-running night
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          containers:
            - name: eval
              image: ghcr.io/esammy/judgekit-api:latest
              command:
                - judgekit
                - calibrate
                - /app/datasets/example.jsonl
                - --rubric
                - /app/rubrics/answer-quality.v2.yaml
                - --min-kappa
                - "0.6"
              envFrom:
                - configMapRef: { name: judgekit-config }
                - secretRef: { name: judgekit-secrets }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }

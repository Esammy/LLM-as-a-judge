[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgekit"
version = "0.1.0"
description = "Most eval tools measure your model. This one measures your judge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Samuel David Egwu", email = "egwusamuel2015@gmail.com" }]
keywords = [
    "llm",
    "llm-as-a-judge",
    "evaluation",
    "evals",
    "calibration",
    "bias",
    "rubric",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=2.1",
]

[project.optional-dependencies]
# No provider SDKs on purpose. Gemini and Groq are each a single HTTP POST, and
# httpx is already a core dependency, so two large transitive dependency trees
# would buy nothing. It also means the Groq adapter works against any
# OpenAI-compatible host by changing one URL.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "arq>=0.28.0",
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=8.3",
    # SQLAlchemy lets the suite run against in-memory SQLite while production
    # uses Postgres, so storage is covered without a database in CI.
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
    # Alembic stamps migrations in UTC, and Python's zoneinfo has no system
    # tz database on Windows. Without this, `alembic revision` fails there
    # with "Can't locate timezone: UTC" - a papercut for any contributor
    # not on Linux.
    "tzdata>=2024.2; sys_platform == 'win32'",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/Esammy/llm-as-a-judge"
Repository = "https://github.com/Esammy/llm-as-a-judge"
Issues = "https://github.com/Esammy/llm-as-a-judge/issues"

[project.scripts]
judgekit = "judgekit.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/judgekit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "ANN",      # annotations
    "S",        # bandit security
    "PT",       # pytest style
    "RET",      # return
    "ARG",      # unused arguments
    "TID",      # tidy imports
]
ignore = [
    "ANN401",   # allow typing.Any where genuinely needed
    "S101",     # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S105", "S106", "PT011"]
# The report embeds a CSS stylesheet. Wrapping declarations at 100 columns
# makes it markedly harder to read than leaving related properties on one
# line, and none of it is Python.
"src/judgekit/core/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["judgekit"]

[tool.mypy]
# No `python_version` pin on purpose. Pinning it to 3.11 makes mypy parse
# numpy's bundled stubs under 3.11 rules, where their 3.12+ `type` statements
# are a syntax error that aborts the whole run. Real 3.11 compatibility is
# covered better anyway: ruff's target-version keeps our syntax 3.11-safe and
# CI runs the test matrix on an actual 3.11 interpreter.
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Deselected by default, not merely skipped. A developer with GEMINI_API_KEY
    # exported should be able to run `pytest` without it silently reaching the
    # network and spending their money. Run them deliberately: `pytest -m live`.
    "-m",
    "not live",
]
markers = [
    "live: hits a real provider; deselected by default, run with `pytest -m live`",
]

[tool.coverage.run]
source = ["src/judgekit"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

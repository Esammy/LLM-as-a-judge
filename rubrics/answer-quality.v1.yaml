# The naive first attempt, kept deliberately.
#
# v1 does not show the judge any evidence. It is here because it is the rubric
# most teams actually start with, and because the difference between its scores
# and v2's is the clearest demonstration of what evidence-aware judging buys
# you: under v1, a correct figure the judge cannot verify gets marked down as a
# suspected fabrication.
#
# Do not edit this file. It is published, it is locked, and historical scores
# depend on its fingerprint. Make a v3 instead.

id: answer-quality
version: v1
description: Holistic answer grading with no evidence shown to the judge.

requires_evidence: false

scale:
  minimum: 1
  maximum: 5
  pass_at: 4

criteria:
  - id: correctness
    description: >-
      Is the answer factually right and responsive to what was actually asked?
    weight: 2.0
  - id: clarity
    description: >-
      Is it clearly written and free of hedging or padding?
    weight: 1.0

instructions: |-
  Grade the answer below against the criteria.

  Score each criterion from 1 to 5, where 1 is unacceptable and 5 is exemplary.
  A score of 4 or above means the answer is good enough to ship.
